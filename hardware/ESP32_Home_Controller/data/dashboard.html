<!DOCTYPE html>
<html lang="pt-AO">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Inteligente | Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="./dashboard.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="nav-brand">
        <span class="brand-name">CASA<span class="accent"> SMART</span></span>
        <span class="brand-sub">ESP32 &mdash; Controlo Residencial</span>
      </div>
      <div class="nav-right">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">A ligar...</span>
        <a href="/login" class="nav-link">Sair</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="layout">

      <!-- Sensors row -->
      <div class="section-title">
        <span class="section-line"></span>
        <span>Ambiente</span>
        <span class="section-line"></span>
      </div>

      <div class="sensors-grid">

        <!-- Temperature -->
        <div class="card" id="cardTemp">
          <div class="card-glow"></div>
          <div class="card-header-row">
            <span class="card-label">TEMPERATURA</span>
            <span class="card-badge">DHT11</span>
          </div>
          <div class="card-value-row">
            <span class="card-icon temp-icon">&#9651;</span>
            <span class="card-value mono" id="temperatureSensor">--.-</span>
            <span class="card-unit">°C</span>
          </div>
          <div class="card-bar">
            <div class="card-bar-fill temp-bar" id="tempBar"></div>
          </div>
        </div>

        <!-- Humidity -->
        <div class="card" id="cardHumid">
          <div class="card-glow card-glow-blue"></div>
          <div class="card-header-row">
            <span class="card-label">HUMIDADE</span>
            <span class="card-badge">DHT11</span>
          </div>
          <div class="card-value-row">
            <span class="card-icon humid-icon">&#9652;</span>
            <span class="card-value mono" id="humiditySensor">--.-</span>
            <span class="card-unit">%</span>
          </div>
          <div class="card-bar">
            <div class="card-bar-fill humid-bar" id="humidBar"></div>
          </div>
        </div>

      </div>

      <!-- Lights row -->
      <div class="section-title">
        <span class="section-line"></span>
        <span>Iluminação</span>
        <span class="section-line"></span>
      </div>

      <div class="lights-grid">

        <!-- Living Room LED -->
        <div class="card card-led" id="cardSala">
          <div class="card-glow card-glow-led" id="salaGlow"></div>
          <div class="card-header-row">
            <span class="card-label">SALA</span>
            <span class="card-badge" id="salaBadge">OFF</span>
          </div>
          <div class="led-visual-row">
            <div class="led-bulb" id="salaBulb">
              <div class="led-core"></div>
              <div class="led-ring"></div>
            </div>
            <div class="led-info">
              <span class="led-state" id="salaStateText">Desligado</span>
              <span class="led-pin">Sala de Estar</span>
            </div>
          </div>
          <button id="btnSala" class="btn btn-primary">&#9654; LIGAR</button>
        </div>

        <!-- Bedroom LED -->
        <div class="card card-led" id="cardQuarto">
          <div class="card-glow card-glow-led" id="quartoGlow"></div>
          <div class="card-header-row">
            <span class="card-label">QUARTO</span>
            <span class="card-badge" id="quartoBadge">OFF</span>
          </div>
          <div class="led-visual-row">
            <div class="led-bulb" id="quartoBulb">
              <div class="led-core"></div>
              <div class="led-ring"></div>
            </div>
            <div class="led-info">
              <span class="led-state" id="quartoStateText">Desligado</span>
              <span class="led-pin">Quarto Principal</span>
            </div>
          </div>
          <button id="btnQuarto" class="btn btn-primary">&#9654; LIGAR</button>
        </div>

      </div>

    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span>&copy; 2026 UCAN</span>
      <span class="footer-ip" id="footerIp"></span>
    </div>
  </footer>

  <script src="./dashboard.js"></script>
</body>

</html>
