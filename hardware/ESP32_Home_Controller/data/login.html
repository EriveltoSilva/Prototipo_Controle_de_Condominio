<!DOCTYPE html>
<html lang="pt-AO">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUINO AI | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="bg-grid"></div>

  <section>
    <div class="login-card">

      <div class="login-header">
        <div class="arduino-day-logo-wrap">
          <img src="./Arduino_DAYS2026_Logo.png" alt="Arduino Days 2026" class="arduino-day-logo">
        </div>
        <!-- <div class="logo-badge">AI</div> -->
        <h1 class="logo-title">DUINO<span class="accent"> AI</span></h1>
      </div>

      <div class="divider"></div>

      <form action="/getin" method="post" class="login-form">

        <div class="input-group">
          <label for="username">USERNAME</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
            </svg>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="admin">
          </div>
        </div>

        <div class="input-group">
          <label for="password">PASSWORD</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" name="password" id="password" required placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>ENTRAR</span>
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z" />
          </svg>
        </button>

      </form>

      <div class="sponsor-row">
        <span class="sponsor-label">Patrocinado por</span>
        <div class="tecmicro-logo-wrap">
          <a href="https://tecmicro.ao" target="_blank">
            <img src="./Tecmicro-logo.png" alt="Tecmicro" class="tecmicro-logo">
          </a>
        </div>
      </div>
    </div>
  </section>

</body>

</html>
