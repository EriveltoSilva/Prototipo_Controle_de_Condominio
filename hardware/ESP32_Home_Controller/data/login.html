<!DOCTYPE html>
<html lang="pt-AO">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Inteligente | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="bg-grid"></div>

  <section>
    <div class="login-card">

      <div class="login-header">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <h1 class="logo-title">CASA<span class="accent"> SMART</span></h1>
        <p class="logo-sub">Controlo Residencial &mdash; ESP32</p>
      </div>

      <div class="divider"></div>

      <form action="/getin" method="post" class="login-form">

        <div class="input-group">
          <label for="username">UTILIZADOR</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
            </svg>
            <input type="text" name="username" id="username" required autocomplete="off" placeholder="admin">
          </div>
        </div>

        <div class="input-group">
          <label for="password">PALAVRA-PASSE</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" name="password" id="password" required placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>ENTRAR</span>
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z" />
          </svg>
        </button>

      </form>

      <p class="footer-note">&copy; 2026 UCAN</p>
    </div>
  </section>

</body>

</html>
